<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline' 'self'; script-src 'self';"
    />
    <title>Login — Bisonstechs POS</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <form class="auth-card" id="login-form">
        <div class="auth-brand">
          <img src="../../assets/icon.png" alt="Bisonstechs" width="52" height="52" />
          <h1>Bisonstechs POS</h1>
          <p class="sub">Sign in with your company account</p>
        </div>

        <label class="auth-label" for="email">Email</label>
        <input class="auth-input" id="email" type="email" autocomplete="username" required placeholder="you@company.com" />

        <label class="auth-label" for="password">Password</label>
        <div class="auth-password-wrap">
          <input class="auth-input" id="password" type="password" autocomplete="current-password" required minlength="6" placeholder="••••••••" />
          <button type="button" class="auth-eye-btn" id="toggle-password" aria-label="Show password" title="Show password">
            <svg class="eye-open" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
            <svg class="eye-closed hidden" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <line x1="1" y1="1" x2="23" y2="23" />
            </svg>
          </button>
        </div>

        <div class="error auth-msg error" id="error"></div>
        <div class="auth-msg blocked" id="blocked-banner" style="display:none"></div>

        <button class="btn-primary" type="submit" id="submit">Sign in</button>
        <p class="auth-hint">Sign in with your email and password.</p>
      </form>
    </div>
    <script src="./login.js"></script>
  </body>
</html>

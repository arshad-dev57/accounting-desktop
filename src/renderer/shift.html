<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';"
    />
    <title>Open Shift — Bisonstechs POS</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      .wrap { min-height: 100%; display: flex; align-items: center; justify-content: center; padding: 32px 16px; }
      .card { width: 100%; max-width: 520px; background: #fff; border-radius: 16px; box-shadow: 0 12px 40px rgba(1, 69, 130, 0.12); padding: 28px; }
      .brand { text-align: center; margin-bottom: 20px; }
      .brand img { width: 64px; height: 64px; object-fit: contain; }
      h1 { margin: 10px 0 4px; font-size: 22px; }
      p.sub { margin: 0; color: var(--muted); font-size: 13px; }
      .user { text-align: center; font-size: 13px; color: var(--muted); margin-bottom: 16px; }
      .list { display: flex; flex-direction: column; gap: 8px; max-height: 280px; overflow: auto; }
      .term {
        border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; text-align: left; background: #fff;
      }
      .term:hover, .term.active { border-color: var(--brand); background: #f0f7fc; }
      .term b { display: block; font-size: 14px; }
      .term span { font-size: 12px; color: var(--muted); }
      label { display: block; font-size: 13px; font-weight: 600; margin: 14px 0 6px; }
      input {
        width: 100%; height: 44px; border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 14px;
      }
      .actions { display: flex; gap: 8px; margin-top: 18px; }
      .actions button { flex: 1; height: 46px; border: 0; border-radius: 10px; font-weight: 700; }
      .primary { background: var(--brand); color: #fff; }
      .ghost { background: #e8eef4; color: var(--navy); }
      .logout { margin-top: 16px; width: 100%; height: 40px; border: 0; background: transparent; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="card">
        <div class="brand">
          <img src="../../assets/icon.png" alt="Bisonstechs" />
          <h1>Open Shift</h1>
          <p class="sub">Select a terminal, then enter opening cash</p>
        </div>
        <div class="user" id="user"></div>
        <p class="sub" id="sync-status">Syncing products…</p>
        <div id="resume-box" class="hidden">
          <p class="sub">A suspended shift was found.</p>
          <div class="actions">
            <button class="primary" id="resume" type="button">Resume shift</button>
          </div>
        </div>
        <div id="terminal-box">
          <div class="list" id="terminals"></div>
          <label for="cash">Opening cash</label>
          <input id="cash" type="number" min="0" step="0.01" value="0" />
          <div class="error hidden" id="error"></div>
          <div class="actions">
            <button class="primary" id="open" type="button">Start selling</button>
          </div>
        </div>
        <button class="logout hidden" id="admin" type="button">POS Management (Admin)</button>
        <button class="logout" id="logout" type="button">Sign out</button>
      </div>
    </div>
    <script src="./location.js"></script>
    <script src="./shift.js"></script>
  </body>
</html>

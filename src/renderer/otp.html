<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self'; style-src 'unsafe-inline' 'self'; script-src 'self';"
    />
    <title>Verify OTP — Bisonstechs POS</title>
    <link rel="stylesheet" href="./shared.css" />
  </head>
  <body>
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-brand">
          <img src="../../assets/icon.png" alt="Bisonstechs" width="52" height="52" />
          <h1>Verify your identity</h1>
          <p class="sub">Enter the 6-digit code sent to your email</p>
        </div>

        <p class="auth-email" id="email"></p>

        <div class="otp-row" id="otp">
          <input maxlength="1" inputmode="numeric" autocomplete="one-time-code" aria-label="Digit 1" />
          <input maxlength="1" inputmode="numeric" aria-label="Digit 2" />
          <input maxlength="1" inputmode="numeric" aria-label="Digit 3" />
          <input maxlength="1" inputmode="numeric" aria-label="Digit 4" />
          <input maxlength="1" inputmode="numeric" aria-label="Digit 5" />
          <input maxlength="1" inputmode="numeric" aria-label="Digit 6" />
        </div>

        <div class="error auth-msg error" id="error"></div>
        <div class="ok auth-msg ok" id="ok"></div>

        <button class="btn-primary" id="submit" type="button">Verify OTP</button>
        <button class="btn-link" id="resend" type="button">Resend OTP</button>
        <button class="btn-link" id="back" type="button">Back to login</button>

        <p class="auth-hint">Didn&apos;t receive the code? Check spam or tap Resend OTP.</p>
      </div>
    </div>
    <script src="./otp.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self';"
    />
    <title>POS Sales — Bisonstechs</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      body { overflow: hidden; }
      .app { height: 100%; display: grid; grid-template-rows: 52px 1fr; }
      .top {
        background: var(--navy); color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 20px;
      }
      .top h1 { font-size: 15px; font-weight: 700; margin: 0; }
      .top-actions { display: flex; gap: 8px; }
      .top-actions button {
        height: 32px; border: 0; border-radius: 8px; padding: 0 14px;
        font-weight: 600; font-size: 12px; cursor: pointer;
      }
      .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
      .main { overflow-y: auto; padding: 20px; }
      .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
      .kpi {
        background: #fff; border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px;
      }
      .kpi span { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; }
      .kpi b { display: block; font-size: 24px; margin-top: 4px; }
      .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; margin-bottom: 16px; }
      .panel h2 { margin: 0; padding: 14px 16px; font-size: 14px; border-bottom: 1px solid var(--line); }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-size: 11px; color: var(--muted); padding: 10px 16px; background: #f8fafc; }
      td { padding: 10px 16px; border-top: 1px solid #f1f5f9; }
      .empty { padding: 32px; text-align: center; color: var(--muted); }
      .credit { color: #0f766e; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top">
        <h1>POS Sales</h1>
        <div class="top-actions">
          <button class="btn-ghost" id="btn-back" type="button">← POS</button>
        </div>
      </div>
      <div class="main">
        <div class="kpi-grid">
          <div class="kpi"><span>Sales count</span><b id="kpi-count">0</b></div>
          <div class="kpi"><span>Total amount</span><b id="kpi-total">$0.00</b></div>
          <div class="kpi"><span>Credit sales</span><b id="kpi-credit">$0.00</b></div>
          <div class="kpi"><span>Cashiers</span><b id="kpi-users">0</b></div>
        </div>
        <div class="panel">
          <h2>By cashier / user</h2>
          <div id="user-table"></div>
        </div>
        <div class="panel">
          <h2>All sales</h2>
          <div id="sales-table"></div>
        </div>
      </div>
    </div>
    <script src="./register.js"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self' 'unsafe-inline';"
    />
    <title>Products — Bisonstechs</title>
    <link rel="stylesheet" href="./shared.css" />
    <style>
      body { overflow: hidden; }
      .app { height: 100vh; display: grid; grid-template-rows: 52px 1fr; }
      .top {
        background: var(--navy); color: #fff;
        display: flex; align-items: center; justify-content: space-between;
        padding: 0 20px;
      }
      .top h1 { font-size: 15px; font-weight: 700; margin: 0; }
      .top-actions { display: flex; gap: 8px; align-items: center; }
      .loc-picker select {
        height: 32px; border-radius: 8px; padding: 0 10px;
        background: rgba(255,255,255,0.12); color: #fff;
        border: 1px solid rgba(255,255,255,0.25); font-weight: 700; font-size: 12px;
      }
      .loc-picker select option { color: #0f172a; }
      .top-actions button, .btn {
        height: 32px; border: 0; border-radius: 8px; padding: 0 14px;
        font-weight: 600; font-size: 12px; cursor: pointer;
      }
      .btn-ghost { background: rgba(255,255,255,0.12); color: #fff; }
      .btn-brand { background: var(--brand); color: #fff; }
      .btn-gray { background: #f1f5f9; color: #475569; }
      .btn-red { background: #fef2f2; color: #dc2626; }
      .main { overflow-y: auto; padding: 20px; display: flex; flex-direction: column; min-height: 0; }
      .tabs { display: flex; gap: 8px; margin-bottom: 14px; overflow-x: auto; flex-shrink: 0; }
      .tab {
        height: 36px; border: 1px solid var(--line); background: #fff;
        border-radius: 8px; padding: 0 14px; font-weight: 700; font-size: 13px;
        white-space: nowrap;
      }
      .tab.active { background: var(--brand); color: #fff; border-color: var(--brand); }
      .toolbar { display: flex; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-shrink: 0; }
      .toolbar input {
        height: 36px; border: 1px solid var(--line); border-radius: 8px; padding: 0 12px; min-width: 240px;
      }
      .panel { background: #fff; border: 1px solid var(--line); border-radius: 14px; overflow: auto; flex: 1; min-height: 260px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th { text-align: left; font-size: 11px; color: var(--muted); padding: 10px 16px; background: #f8fafc; }
      td { padding: 10px 16px; border-top: 1px solid #f1f5f9; }
      .empty { padding: 36px; text-align: center; color: var(--muted); }
      .icon-btn { border: 0; background: transparent; cursor: pointer; font-size: 14px; }
      
      /* Form Modal */
      .overlay {
        display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
        align-items: center; justify-content: center; z-index: 50;
      }
      .overlay.show { display: flex; }
      .modal { 
        background: #fff; width: 900px; max-width: 95vw; max-height: 90vh; 
        border-radius: 16px; padding: 20px; overflow: auto; position: relative;
      }
      .modal h3 { margin: 0 0 14px; font-size: 16px; }
      .form-tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--line); }
      .form-tab {
        border: none; background: transparent; padding: 10px 14px;
        font-weight: 600; font-size: 12px; color: var(--muted);
        border-bottom: 2px solid transparent;
      }
      .form-tab.active { color: var(--brand); border-bottom-color: var(--brand); }
      .form-panel { display: none; }
      .form-panel.active { display: block; }
      .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .form-grid .full-width { grid-column: 1 / -1; }
      .field { margin-bottom: 10px; }
      .field label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 4px; color: #374151; }
      .field input, .field textarea, .field select {
        width: 100%; border: 1px solid var(--line); border-radius: 8px; 
        padding: 8px 10px; font-size: 13px;
      }
      .field textarea { height: 60px; resize: vertical; }
      .field input:focus, .field textarea:focus, .field select:focus {
        outline: none; border-color: var(--brand); box-shadow: 0 0 0 2px rgba(1,69,130,0.1);
      }
      .field-group { background: #f8fafc; border-radius: 10px; padding: 12px; margin-bottom: 12px; }
      .field-group h4 { margin: 0 0 10px; font-size: 12px; font-weight: 700; }
      .checkbox-group { display: flex; align-items: center; gap: 8px; }
      .checkbox-group input[type="checkbox"] { width: auto; }
      .checkbox-group label { margin: 0; font-size: 13px; }
      .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; padding-top: 16px; border-top: 1px solid var(--line); }
      .err { color: #b91c1c; font-size: 12px; margin-bottom: 8px; }
      .badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; }
      .ok-badge { background: #d1fae5; color: #047857; }
      .off-badge { background: #fee2e2; color: #b91c1c; }
      .warn-badge { background: #fef3c7; color: #b45309; }
      .pager { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; align-items: center; }
      .image-preview { 
        display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; 
      }
      .image-preview img { 
        width: 60px; height: 60px; object-fit: cover; 
        border-radius: 8px; border: 1px solid var(--line); 
      }
      .code-card {
        grid-column: 1 / -1;
        border: 1px solid var(--line);
        background: #f8fafc;
        border-radius: 12px;
        padding: 12px;
      }
      .code-card-head {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        align-items: flex-start;
        margin-bottom: 10px;
      }
      .code-card-head p { margin: 4px 0 0; font-size: 11px; color: var(--muted); }
      .code-card-actions { display: flex; flex-wrap: wrap; gap: 8px; }
      .btn-scan {
        height: 32px; border: 0; border-radius: 8px; padding: 0 12px;
        background: var(--brand); color: #fff; font-weight: 700; font-size: 12px; cursor: pointer;
      }
      .btn-auto {
        height: 32px; border: 1px solid var(--brand); border-radius: 8px; padding: 0 12px;
        background: #fff; color: var(--brand); font-weight: 700; font-size: 12px; cursor: pointer;
      }
      .code-preview {
        margin-top: 10px;
        min-height: 72px;
        border: 2px dashed #e5e7eb;
        border-radius: 12px;
        background: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 12px;
        text-align: center;
      }
      .code-preview b {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 18px;
        letter-spacing: 1px;
        word-break: break-all;
      }
      .code-preview span { font-size: 11px; color: #6b7280; margin-top: 6px; }
      .code-ok { color: #047857; font-size: 11px; font-weight: 700; margin-top: 8px; text-align: center; }
      .select-add { display: flex; gap: 8px; align-items: stretch; position: relative; }
      .select-add select { flex: 1; }
      .btn-plus {
        width: 38px; flex-shrink: 0; border: 1px solid var(--line); border-radius: 8px;
        background: #fff; color: #64748b; font-size: 20px; font-weight: 700; line-height: 1; cursor: pointer;
      }
      .btn-plus:hover { border-color: var(--brand); color: var(--brand); }
      .btn-plus:disabled { opacity: 0.4; cursor: not-allowed; }
      .mini-overlay {
        display: none; position: fixed; inset: 0; background: rgba(15,23,42,.35);
        align-items: center; justify-content: center; z-index: 60;
      }
      .mini-overlay.show { display: flex; }
      .mini-card {
        background: #fff; width: 320px; max-width: 92%; border-radius: 12px;
        padding: 16px; box-shadow: 0 12px 40px rgba(0,0,0,.18);
      }
      .mini-card h4 { margin: 0 0 10px; font-size: 14px; }
      .mini-card input {
        width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 8px;
        padding: 0 10px; font-size: 13px;
      }
      .mini-card .mini-err { color: #b91c1c; font-size: 12px; min-height: 16px; margin: 8px 0; }
      .mini-actions { display: flex; justify-content: flex-end; gap: 8px; }
    </style>
  </head>
  <body>
    <div class="app">
      <div class="top">
        <h1>Products</h1>
        <div class="top-actions">
          <div class="loc-picker">
            <select id="location-select" title="Location"></select>
          </div>
          <button class="btn-ghost" id="btn-categories" type="button">Categories</button>
          <button class="btn-ghost" id="btn-back" type="button">← POS</button>
        </div>
      </div>
      <div class="main">
        <div class="toolbar">
          <input id="search" type="text" placeholder="Search by name, SKU, or barcode..." />
          <button class="btn-ghost" id="btn-scan" type="button">📷 Scan QR/Barcode</button>
          <button class="btn-brand" id="btn-add" type="button">+ Add Product</button>
        </div>
        <div class="panel" id="table-wrap"></div>
      </div>
    </div>
    
    <div class="overlay" id="overlay">
      <div class="modal" id="modal-body">
        <div class="err" id="form-error"></div>
        <div id="form-container"></div>
        <div class="mini-overlay" id="quick-add-overlay">
          <div class="mini-card">
            <h4 id="quick-add-title">Add category</h4>
            <input id="quick-add-name" type="text" placeholder="Name *" autocomplete="off" />
            <div class="mini-err" id="quick-add-error"></div>
            <div class="mini-actions">
              <button type="button" class="btn btn-gray" id="quick-add-cancel">Cancel</button>
              <button type="button" class="btn btn-brand" id="quick-add-save">Add &amp; select</button>
            </div>
          </div>
        </div>
      </div>
    </div>
    
    <script src="./location.js"></script>
    <script src="./scan-code.js"></script>
    <script src="./products.js"></script>
  </body>
</html>

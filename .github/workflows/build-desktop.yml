# Build unsigned POS desktop installers on native runners (no cross-platform NSIS on macOS).
name: Build POS Desktop

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows-x64:
    name: Windows x64 (NSIS)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run build:win
        env:
          # Unsigned build unless CSC_LINK / CSC_KEY_PASSWORD are configured in repo secrets.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: pos-desktop-win-x64
          path: |
            dist-electron/*.exe
            dist-electron/*.exe.blockmap
          if-no-files-found: error

  build-macos-arm64:
    name: macOS Apple Silicon (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS arm64 DMG
        run: npm run build:mac:arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS arm64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pos-desktop-mac-arm64
          path: |
            dist-electron/*-mac-arm64.dmg
            dist-electron/*-mac-arm64.dmg.blockmap
            dist-electron/*-mac-arm64.zip
            dist-electron/*-mac-arm64.zip.blockmap
          if-no-files-found: error

  build-macos-x64:
    name: macOS Intel (DMG)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build macOS x64 DMG
        run: npm run build:mac:x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload macOS x64 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pos-desktop-mac-x64
          path: |
            dist-electron/*-mac-x64.dmg
            dist-electron/*-mac-x64.dmg.blockmap
            dist-electron/*-mac-x64.zip
            dist-electron/*-mac-x64.zip.blockmap
          if-no-files-found: error
